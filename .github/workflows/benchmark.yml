# GitHub Actions Workflow for SSG Benchmark
# Runs automated benchmarks on schedule and manual trigger

name: SSG Benchmark

on:
  # Run weekly on Sunday at midnight UTC
  schedule:
    - cron: '0 0 * * 0'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      ssgs:
        description: 'SSGs to benchmark (space-separated)'
        required: false
        default: 'hugo zola jekyll hwaro eleventy pelican hexo'
      scenarios:
        description: 'Scenarios (space-separated): minimal blog heavy'
        required: false
        default: 'minimal blog heavy'
      page_counts:
        description: 'Page counts to test (space-separated)'
        required: false
        default: '10 100 1000'
      iterations:
        description: 'Number of iterations per test'
        required: false
        default: '3'

env:
  DEFAULT_SSGS: 'hugo zola jekyll hwaro eleventy pelican hexo'
  DEFAULT_SCENARIOS: 'minimal blog heavy'
  DEFAULT_PAGE_COUNTS: '10 100 1000'
  DEFAULT_ITERATIONS: '3'
  # GitHub-hosted runners have 2 vCPUs and ~7GB RAM. Asking for --cpus=4 there
  # does not cap anything; the runner would report a limit it never enforced.
  BENCH_DOCKER_CPUS: '2'
  BENCH_DOCKER_MEMORY: '5g'

jobs:
  benchmark:
    name: Run SSG Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*.py

      # benchmark.sh builds the images itself, passing docker/versions.env as
      # --build-arg. Building them here too would duplicate that logic and risk
      # the two drifting apart, so this step only verifies that every requested
      # SSG has a Dockerfile before a long run starts.
      - name: Check Dockerfiles exist
        run: |
          SSGS="${{ github.event.inputs.ssgs || env.DEFAULT_SSGS }}"
          missing=""
          for ssg in $SSGS; do
            # A variant ("<family>-<variant>", e.g. hwaro-main) deliberately has
            # no Dockerfile of its own; it builds from its family's with a
            # different source ref. See docker/Dockerfile.hwaro.
            [ -f "docker/Dockerfile.${ssg}" ] && continue
            [ -f "docker/Dockerfile.${ssg%%-*}" ] || missing="${missing} ${ssg}"
          done
          if [ -n "$missing" ]; then
            echo "::error::No Dockerfile for:${missing}"
            exit 1
          fi

      - name: Run Benchmark
        run: |
          export SSGS="${{ github.event.inputs.ssgs || env.DEFAULT_SSGS }}"
          export SCENARIOS="${{ github.event.inputs.scenarios || env.DEFAULT_SCENARIOS }}"
          export PAGE_COUNTS="${{ github.event.inputs.page_counts || env.DEFAULT_PAGE_COUNTS }}"
          export ITERATIONS="${{ github.event.inputs.iterations || env.DEFAULT_ITERATIONS }}"
          export USE_DOCKER=true
          export VERBOSE=true
          export DOCKER_CPUS="${{ env.BENCH_DOCKER_CPUS }}"
          export DOCKER_MEMORY="${{ env.BENCH_DOCKER_MEMORY }}"

          ./scripts/benchmark.sh

      # The run directory is named for its start time, so sorting by name is
      # sorting by recency. `ls -t` sorted by mtime, which on a fresh checkout
      # is checkout order — effectively arbitrary.
      - name: Resolve latest run directory
        id: latest
        run: |
          LATEST=$(ls -1 results/ | grep -E '^[0-9]{8}_[0-9]{6}$' | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No run directory produced by benchmark.sh"
            exit 1
          fi
          echo "run_id=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "dir=results/${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Generate Reports
        run: |
          DIR="${{ steps.latest.outputs.dir }}"
          ./scripts/report.sh -r "$DIR" -f markdown > "${DIR}/report.md"
          ./scripts/report.sh -r "$DIR" -f json     > "${DIR}/report.json"
          ./scripts/report.sh -r "$DIR" -f html     > "${DIR}/report.html"

      - name: Upload Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: results/
          retention-days: 90

      - name: Create Results Summary
        run: |
          DIR="${{ steps.latest.outputs.dir }}"
          {
            echo "## 🚀 SSG Benchmark Results"
            echo ""
            echo "**Run:** ${{ github.run_number }} (\`${{ steps.latest.outputs.run_id }}\`)"
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            cat "${DIR}/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # A run whose parity guard fired, or whose SSGs skipped scenario features,
      # produced numbers that must not be published as a comparison. Surface it
      # loudly rather than committing it quietly.
      - name: Flag invalid comparisons
        run: |
          DIR="${{ steps.latest.outputs.dir }}"
          if [ -f "${DIR}/parity.json" ] && ! grep -q '"ok": true' "${DIR}/parity.json"; then
            echo "::warning::Output parity check failed — see ${DIR}/summary.md"
          fi
          for f in "${DIR}"/verify_*.json; do
            [ -e "$f" ] || continue
            if ! grep -q '"ok": true' "$f"; then
              echo "::warning::Scenario feature verification failed in $(basename "$f")"
            fi
          done

      - name: Generate Dashboard Data
        run: ./scripts/generate-site.sh

      - name: Commit Results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add "${{ steps.latest.outputs.dir }}" web/static/data.json
          git commit -m "chore: add benchmark results ${{ steps.latest.outputs.run_id }}" \
            || { echo "No changes to commit"; exit 0; }
          git push

  compare:
    name: Compare with Previous Results
    runs-on: ubuntu-latest
    needs: benchmark
    if: always() && needs.benchmark.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Current Results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: results/

      # This compared column 4 of results.csv, which is `iteration` — so every
      # "build time" it printed was 1, 2 or 3, and every delta was 0. It also
      # took the first matching row regardless of scenario or page count, so
      # even with the right column it would have compared a 10-page minimal
      # build against a 1000-page heavy one.
      - name: Compare Results
        run: |
          python3 scripts/compare-runs.py results >> "$GITHUB_STEP_SUMMARY"
